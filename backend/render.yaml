# Render Blueprint for Job Portal Backend

services:
  - type: web
    name: job-portal-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free # Change to 'starter' or other plans as needed
    region: oregon # Choose your preferred region
    
    # Environment variables
    envVars:
      - key: PORT
        value: 8080
      
      - key: SPRING_PROFILES_ACTIVE
        value: production
      
      # Database - Update with your actual database URL
      - key: SPRING_DATASOURCE_URL
        value: jdbc:mysql://2WUUcpabxP9DYkL.root:RwTRraUYy8dPG35H@gateway01.us-west-2.prod.aws.tidbcloud.com:4000/test?sslMode=VERIFY_IDENTITY
      
      # JWT Secret - Use a strong random secret in production
      - key: JWT_SECRET
        generateValue: true
        sync: false
      
      - key: JWT_EXPIRATION
        value: 86400000
      
      # CORS - Update with your Netlify URL
      - key: CORS_ALLOWED_ORIGINS
        value: https://novalianajob.netlify.app
      
      # Email Configuration - Add these in Render dashboard as secrets
      - key: SPRING_MAIL_HOST
        value: smtp.gmail.com
      
      - key: SPRING_MAIL_PORT
        value: 587
      
      - key: SPRING_MAIL_USERNAME
        sync: false # Set this in Render dashboard
      
      - key: SPRING_MAIL_PASSWORD
        sync: false # Set this in Render dashboard as a secret
      
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update # Use 'update' instead of 'create' in production

